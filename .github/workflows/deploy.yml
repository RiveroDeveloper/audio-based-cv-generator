name: Deploy Flutter Web to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web and install dependencies
        run: |
          flutter config --enable-web
          flutter pub get

      - name: Generate .env from GitHub secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "PDF_MONKEY_API_KEY=${{ secrets.PDF_MONKEY_API_KEY }}" >> .env

      - name: Build web
        run: flutter build web --dart-define=AUTH_DISABLED=true --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" --dart-define=ELEVENLABS_API_KEY="${{ secrets.ELEVENLABS_API_KEY }}" --dart-define=OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" --dart-define=PDF_MONKEY_API_KEY="${{ secrets.PDF_MONKEY_API_KEY }}"

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"